{% extends "base.html" %}
{% block title %}Sign in | JudgeForge{% endblock %}
{% block content %}
<div class="card" style="max-width:550px;margin:2rem auto;padding:2rem">
<h1>Sign in</h1>
{% if demo_mode %}
<p>Local demo accounts use password <code>JudgeForge-Demo-2026!</code>. These public credentials are for evaluation only.</p>
<select id="demoAccount" onchange="document.getElementById('email').value=this.value">
<option value="">Choose a demo account</option>
<option>organizer@judgeforge.local</option><option>tomas.varga@example.org</option>
<option>wei.lindqvist@example.org</option><option>priya1@example.org</option></select>
{% endif %}
<form id="authForm">
<label for="email">Email</label><input id="email" type="email" required autocomplete="username">
<label for="password">Password</label><input id="password" type="password" required autocomplete="current-password">
<label for="name">Name (for a new participant account)</label><input id="name" maxlength="100" autocomplete="name">
<p id="message" role="status"></p>
<button class="btn btn-primary" type="submit">Sign in</button>
<button class="btn btn-secondary" type="button" onclick="authenticate(true)">Create participant account</button>
</form></div>
<script>
document.getElementById('authForm').onsubmit=e=>{e.preventDefault();authenticate(false)};
async function authenticate(register) {
const body={email:document.getElementById('email').value,password:document.getElementById('password').value};
const message=document.getElementById('message');
if(register) body.name=document.getElementById('name').value;
try {
const res=await fetch(register?'/api/auth/register':'/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
const data=await res.json();
if(!res.ok){message.textContent=typeof data.detail==='string'?data.detail:'Check the fields. New passwords need at least 12 characters.';return;}
if(register){message.textContent='Account created. Sign in to continue.';return;}
location.href=data.user.role==='organizer'?'/organizer':data.user.role==='judge'?'/judge':'/workspace';
}catch(error){message.textContent='Connection failed. Please try again.';}
}
</script>
{% endblock %}
